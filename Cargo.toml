[package]
name = "open-miami"
version = "0.1.0"
edition = "2021"
authors = ["c4ffein"]
license = "MIT"
description = "An open-source Hotline Miami clone in Rust for the browser"
autobins = false

[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "EventTarget",
    "Performance",
    "console",
    "AudioContext",
    "AudioContextState",
    "BaseAudioContext",
    "OfflineAudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "OscillatorNode",
    "OscillatorType",
    "GainNode",
    "BiquadFilterNode",
    "BiquadFilterType",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioScheduledSourceNode",
    "ConvolverNode",
    "DynamicsCompressorNode",
    "WaveShaperNode",
    "OverSampleType",
    "DelayNode",
] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
# One codegen unit = whole-crate optimisation (smaller / faster wasm, slower
# link). panic = "abort" drops the unwinding tables + landing pads from the
# wasm (nothing in src/ uses catch_unwind / set_hook; a panic already aborts
# in the browser). Release only — `cargo test` uses the test/dev profile,
# which keeps unwinding (tests need it). strip: no-op for the wasm target
# (wasm-bindgen strips debug sections itself), harmless for the native lib.
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
