# The two browser suites, one job each (matrix): `make check-e2e` (the
# Playwright specs) and `make check-render` (the renderer acceptance scripts).
# Both go through the Makefile's `e2e-prep` (wasm + glue, bun install,
# Chromium) — nothing is re-implemented here.
name: E2E Tests

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  browser:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        target: [check-e2e, check-render]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-deps-

      - name: Cache cargo build (wasm release)
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock
      # exactly; `make build-wasm` installs that version when it is missing
      # or drifts, so cache the binary keyed on the version.
      - name: wasm-bindgen version (from Cargo.lock)
        id: wb
        run: echo "version=$(grep -A 2 'name = "wasm-bindgen"' Cargo.lock | grep '^version = ' | head -1 | sed 's/version = "\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ steps.wb.outputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/bun.lock') }}

      # No continue-on-error: a failing suite fails the job. The artifacts
      # below still upload via `if: always()`.
      - name: make ${{ matrix.target }}
        id: suite
        run: make ${{ matrix.target }}

      - name: Upload test results
        if: always() && matrix.target == 'check-e2e'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload screenshots
        if: always() && matrix.target == 'check-e2e'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/test-results/*.png
          retention-days: 30
          if-no-files-found: warn

      # The PR comment reflects the real outcome of the test step (pass/fail),
      # not a count of PNG files. Skipped for PRs from forks (read-only token).
      - name: Comment test results on PR
        if: always() && matrix.target == 'check-e2e' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          E2E_OUTCOME: ${{ steps.suite.outcome }}
        with:
          script: |
            const outcome = process.env.E2E_OUTCOME; // success | failure | cancelled | skipped
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const verdict = {
              success: 'PASSED',
              failure: 'FAILED',
              cancelled: 'CANCELLED',
              skipped: 'SKIPPED (an earlier step failed)',
            }[outcome] || outcome;

            let body = '## E2E Test Results\n\n';
            body += `**${verdict}** (\`${context.sha.slice(0, 7)}\`)\n\n`;
            body += `Screenshots and the Playwright HTML report are attached as artifacts of the [workflow run](${runUrl}).\n`;

            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const botComment = comments.find((c) =>
              c.user.type === 'Bot' && c.body.includes('## E2E Test Results')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
