name: WASM Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-deps-

      - name: Cache cargo build (wasm release)
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock
      # exactly; `make build-wasm` installs that version when it is missing
      # or drifts, so cache the binary keyed on the version.
      - name: wasm-bindgen version (from Cargo.lock)
        id: wb
        run: echo "version=$(grep -A 2 'name = "wasm-bindgen"' Cargo.lock | grep '^version = ' | head -1 | sed 's/version = "\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ steps.wb.outputs.version }}

      # The Makefile owns the build: wasm32 release build + wasm-bindgen glue.
      - name: Build WASM + glue (make build-wasm)
        run: |
          make build-wasm
          ls -lh open_miami.js open_miami_bg.wasm

      # Stage the complete runtime file set under dist/, preserving paths.
      # The page needs, at runtime:
      #   index.html                    - the entry page (loads the two below)
      #   open_miami.js                 - wasm-bindgen glue
      #   open_miami_bg.wasm            - the engine (simulation)
      #   renderer.js                   - the WebGL renderer (all rendering is JS)
      #   robot-core.js                 - 3D->2D robot pipeline (imported by renderer.js)
      #   shoggoth-core.js              - the boss pipeline (imported by renderer.js)
      #   assets/**                     - VT323 font + its OFL license
      #   tools/**                      - the ?viz panels (inspector.html, levels.html,
      #                                   levels-editor*.js); gen_levels.py is
      #                                   build-time only and is omitted
      #   levels/**                     - the level editor fetches index.json + floors
      #
      # NOTE: the deploy assumes the site is served from the ROOT of a host
      # (custom domain / user site). tools/levels.html and tools/inspector.html
      # use absolute paths (`/levels/...`, `/?floor=N`), which do not resolve
      # under a project-Pages subpath (https://<user>.github.io/<repo>/).
      # TODO: make those paths relative (or base-aware) in tools/ before
      # deploying under a project-Pages subpath.
      - name: Stage runtime files into dist/
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/tools
          cp index.html open_miami.js open_miami_bg.wasm \
             renderer.js robot-core.js shoggoth-core.js dist/
          cp -r assets dist/assets
          cp -r levels dist/levels
          cp tools/*.html tools/*.js dist/tools/
          echo "dist/ contents:"
          find dist -type f | sort

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-miami-wasm
          path: dist/
          retention-days: 30

  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: open-miami-wasm
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # Auto-enable Pages (source: GitHub Actions) on repos where it was
          # never switched on — this step otherwise 404s ("Get Pages site
          # failed") and the deploy never runs.
          enablement: true

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
